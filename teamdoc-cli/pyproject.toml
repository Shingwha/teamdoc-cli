[project]
name = "teamdoc-cli"
version = "0.1.0"
description = "TeamDoc 知识库命令行工具(td):项目、文档、云空间文件的终端操作"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.28",
]

[project.scripts]
td = "teamdoc_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teamdoc_cli"]
